name: Java

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build project + run Checkstyle
        run: ./gradlew clean build checkstyleMain checkstyleTest

      # Upload Checkstyle HTML report
      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: |
            build/reports/checkstyle/

      # Upload JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar
          path: build/libs/*.jar

      # Publish Checkstyle results
      - name: Publish Checkstyle results
        uses: jwgmeligmeyling/checkstyle-github-action@master
        with:
          path: build/reports/checkstyle/main.xml